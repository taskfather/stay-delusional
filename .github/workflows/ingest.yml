name: ingest
on:
  repository_dispatch:
    types: [guide-event]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON { "events": [ ... ] }
        required: false
        default: "{}"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge events
        env:
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload }}
        run: python3 .github/scripts/ingest.py
      - name: Commit
        run: |
          git config user.name "staydl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/v1/metrics.json metrics/events.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "metrics: ingest"
          git push
