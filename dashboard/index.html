<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STAYDL · Metrics</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 28px 24px 48px;
    }
    h1 {
      font-size: 13px;
      letter-spacing: 0.22em;
      font-weight: 500;
      color: #888;
      margin: 0 0 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    .stat .k {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: #666;
    }
    .stat .v {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-top: 6px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: #666;
      font-weight: 500;
      padding: 10px 8px;
      border-bottom: 1px solid #1a1a1a;
    }
    td { padding: 10px 8px; border-bottom: 1px solid #141414; }
    .mute { color: #888; }
    h2 {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: #666;
      font-weight: 500;
      margin: 32px 0 8px;
    }
    .empty { color: #555; padding: 24px 0; }
  </style>
</head>
<body>
  <h1>STAYDL / GUIDES</h1>
  <div class="grid">
    <div class="stat"><div class="k">READS</div><div class="v" id="events">—</div></div>
    <div class="stat"><div class="k">FINISHED</div><div class="v" id="rate">—</div></div>
    <div class="stat"><div class="k">DROPPED</div><div class="v" id="dropped">—</div></div>
    <div class="stat"><div class="k">UPDATED</div><div class="v" id="when" style="font-size:18px;padding-top:10px">—</div></div>
  </div>
  <h2>VARIANTS</h2>
  <table id="variants"><thead><tr><th>PACK</th><th>VAR</th><th>N</th><th>DONE</th><th>AVG SLIDE</th></tr></thead><tbody></tbody></table>
  <h2>RECENT</h2>
  <table id="recent"><thead><tr><th>PACK</th><th>VAR</th><th>DONE</th><th>DWELL</th><th>WHEN</th></tr></thead><tbody></tbody></table>
  <p class="empty" id="empty" hidden>No events yet. The app sends them when a phone is online.</p>
  <script>
    const urls = [
      "../content/v1/metrics.json",
      "/content/v1/metrics.json",
      "https://staydelusional.com/content/v1/metrics.json",
      "https://taskfather.github.io/stay-delusional/content/v1/metrics.json",
    ];
    function ms(n) {
      if (!n && n !== 0) return "—";
      if (n < 1000) return Math.round(n) + "ms";
      return (n / 1000).toFixed(1) + "s";
    }
    function pct(a, b) {
      if (!b) return "—";
      return Math.round((a / b) * 100) + "%";
    }
    async function load() {
      let data = null;
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (r.ok) { data = await r.json(); break; }
        } catch (e) {}
      }
      if (!data) return;
      document.getElementById("events").textContent = data.events || 0;
      document.getElementById("dropped").textContent = data.dropped || 0;
      document.getElementById("rate").textContent = pct(data.completed || 0, data.events || 0);
      document.getElementById("when").textContent = data.updatedAt
        ? new Date(data.updatedAt).toLocaleString()
        : "—";
      const vbody = document.querySelector("#variants tbody");
      const rows = Object.values(data.variants || {});
      vbody.innerHTML = rows.map((v) => `<tr>
        <td>${v.pack || ""}</td>
        <td>${v.variant || ""}</td>
        <td>${v.n || 0}</td>
        <td>${pct(v.completed || 0, v.n || 0)}</td>
        <td class="mute">${ms(v.avgSlideMs)}</td>
      </tr>`).join("") || "";
      const rbody = document.querySelector("#recent tbody");
      const recent = data.recent || [];
      rbody.innerHTML = recent.map((e) => `<tr>
        <td>${e.pack || ""}</td>
        <td>${e.variant || ""}</td>
        <td>${e.completed ? "yes" : "no"}</td>
        <td class="mute">${ms((e.slideMs || []).reduce((a, b) => a + b, 0))}</td>
        <td class="mute">${e.endedAt ? new Date(e.endedAt).toLocaleString() : ""}</td>
      </tr>`).join("");
      document.getElementById("empty").hidden = (data.events || 0) > 0 || rows.length > 0;
    }
    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
